name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  reuse:
    name: Check REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@e7311834582dc0edd56639cd8e234a6c62ebfcfa # main

  license-compatibility:
    name: Check License Compatibility
    uses: SecPal/.github/.github/workflows/reusable-license-compatibility.yml@e7311834582dc0edd56639cd8e234a6c62ebfcfa # main

  prettier:
    name: Formatting Check
    uses: SecPal/.github/.github/workflows/reusable-prettier.yml@e7311834582dc0edd56639cd8e234a6c62ebfcfa # main

  markdown-lint:
    name: Markdown Lint
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@e7311834582dc0edd56639cd8e234a6c62ebfcfa # main

  ai-instructions:
    name: AI Instructions
    uses: SecPal/.github/.github/workflows/reusable-ai-instructions.yml@e7311834582dc0edd56639cd8e234a6c62ebfcfa # main

  eslint:
    name: ESLint
    uses: SecPal/.github/.github/workflows/reusable-node-lint.yml@e7311834582dc0edd56639cd8e234a6c62ebfcfa # main
    with:
      node-version: "22"

  astro-check:
    name: Astro TypeScript Check
    uses: SecPal/.github/.github/workflows/reusable-node-build.yml@e7311834582dc0edd56639cd8e234a6c62ebfcfa # main
    with:
      node-version: "22"
      build-command: "npm run check"

  build:
    name: Astro Build
    uses: SecPal/.github/.github/workflows/reusable-node-build.yml@e7311834582dc0edd56639cd8e234a6c62ebfcfa # main
    with:
      node-version: "22"
      build-command: "npm run build"

  test:
    name: Node Tests
    uses: SecPal/.github/.github/workflows/reusable-node-test.yml@d56bd229c11848ac9231023cd49f1e968486c94e # main
    with:
      node-version: "22"
      test-command: "npm test"
